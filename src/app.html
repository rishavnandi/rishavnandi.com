<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Rishav Nandi" />

    <!-- Optimize for speed -->
    <meta http-equiv="x-dns-prefetch-control" content="on" />

    <!-- Critical Resource Preloading - fonts with highest priority -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/Geist.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      fetchpriority="high"
    />

    <!-- DNS Prefetch & Preconnect for External Resources -->
    <link rel="preconnect" href="https://va.vercel-scripts.com" crossorigin />
    <link rel="dns-prefetch" href="//github.com" />
    <link rel="dns-prefetch" href="//linkedin.com" />
    <link rel="dns-prefetch" href="//twitter.com" />
    <link rel="dns-prefetch" href="//img.icons8.com" />

    <link rel="icon" type="image/png" href="%sveltekit.assets%/images/logo_png.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@rishav__nandi" />

    %sveltekit.head%
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.rishavnandi.com/#website",
            "url": "https://www.rishavnandi.com/",
            "name": "Rishav Nandi",
            "alternateName": ["Rishav", "rishavnandi"]
          },
          {
            "@type": "ProfilePage",
            "@id": "https://www.rishavnandi.com/#profile",
            "url": "https://www.rishavnandi.com/",
            "name": "Rishav Nandi | Gen AI Platform Engineer & DevOps",
            "mainEntity": { "@id": "https://www.rishavnandi.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://www.rishavnandi.com/#person",
            "name": "Rishav Nandi",
            "alternateName": ["Rishav", "rishavnandi"],
            "url": "https://www.rishavnandi.com/",
            "description": "Gen AI Platform Engineer and DevOps practitioner building AI infrastructure, automation, and self-hosted systems.",
            "jobTitle": "Gen AI Platform Engineer",
            "worksFor": {
              "@type": "Organization",
              "name": "Tata Consultancy Services"
            },
            "sameAs": [
              "https://github.com/rishavnandi",
              "https://www.linkedin.com/in/rishavnandi/",
              "https://twitter.com/rishav__nandi",
              "https://dev.to/rishavnandi"
            ],
            "knowsAbout": [
              "Generative AI",
              "AI Platform Engineering",
              "DevOps",
              "Automation",
              "AI Infrastructure",
              "LLM Fine-Tuning",
              "RAG",
              "MCP",
              "Docker",
              "Kubernetes",
              "Terraform",
              "Ansible",
              "GitOps",
              "SRE"
            ]
          }
        ]
      }
    </script>
  </head>
  <body
    data-sveltekit-preload-data="tap"
    data-sveltekit-preload-code="hover"
    class="min-h-screen scroll-smooth bg-neutral-100 font-sans antialiased selection:bg-neutral-200 dark:bg-neutral-900 dark:selection:bg-neutral-700"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
